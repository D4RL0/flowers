{% extends 'plantilla.html' %}{% block titulo %}Editar proveedor{% endblock %}{% block contenido %}
<div class="mb-4"><span class="eyebrow">Administración · Proveedores</span><h1 class="page-title">Editar proveedor</h1><p class="page-subtitle">Código inmodificable: {{ proveedorEditar.codigo_proveedor }}</p></div><form action="{% url 'procesarEdicionProveedor' %}" method="post" class="panel">{% csrf_token %}<input type="hidden" name="codigo_proveedor" value="{{ proveedorEditar.codigo_proveedor }}"><div class="panel-body"><div class="row g-3"><div class="col-md-6"><label class="form-label required">Nombres</label><input class="form-control" name="nombres" value="{{ proveedorEditar.nombres }}" maxlength="100" required></div><div class="col-md-6"><label class="form-label required">Apellidos</label><input class="form-control" name="apellidos" value="{{ proveedorEditar.apellidos }}" maxlength="100" required></div><div class="col-md-6"><label class="form-label required">Cédula o RUC ecuatoriano</label><input class="form-control" name="cedula_ruc" value="{{ proveedorEditar.cedula_ruc }}" minlength="10" maxlength="13" pattern="(?:[0-9]{10}|[0-9]{13})" placeholder="Ingrese 10 o 13 dígitos" required><div class="help-text mt-1">Cédula: 10 dígitos · RUC: 13 dígitos.</div></div><div class="col-md-6"><label class="form-label required">Teléfono</label><input class="form-control" name="telefono" value="{{ proveedorEditar.telefono }}" maxlength="15" required></div></div></div><div class="panel-head justify-content-end"><a href="{% url 'inicioProveedor' %}" class="btn btn-light">Cancelar</a><button class="btn btn-primary">Guardar cambios</button></div></form>
{% endblock %}
