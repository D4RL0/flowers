{% extends 'plantilla.html' %}{% block titulo %}Nuevo proveedor{% endblock %}{% block contenido %}
<div class="mb-4"><span class="eyebrow">Administración · Proveedores</span><h1 class="page-title">Registrar proveedor</h1><p class="page-subtitle">El código se asignará automáticamente al guardar.</p></div><form action="{% url 'guardarProveedor' %}" method="post" class="panel">{% csrf_token %}<div class="panel-body"><div class="row g-3"><div class="col-md-6"><label class="form-label required">Nombres</label><input class="form-control" name="nombres" maxlength="100" required></div><div class="col-md-6"><label class="form-label required">Apellidos</label><input class="form-control" name="apellidos" maxlength="100" required></div><div class="col-md-6"><label class="form-label required">Cédula o RUC ecuatoriano</label><input class="form-control" name="cedula_ruc" minlength="10" maxlength="13" pattern="(?:[0-9]{10}|[0-9]{13})" placeholder="Ingrese 10 o 13 dígitos" required><div class="help-text mt-1">Cédula: 10 dígitos · RUC: 13 dígitos.</div></div><div class="col-md-6"><label class="form-label required">Teléfono</label><input class="form-control" name="telefono" maxlength="15" pattern="[0-9+ -]+" required></div></div></div><div class="panel-head justify-content-end"><a href="{% url 'inicioProveedor' %}" class="btn btn-light">Cancelar</a><button class="btn btn-primary"><i class="bi bi-check2 me-2"></i>Guardar proveedor</button></div></form>
{% endblock %}
