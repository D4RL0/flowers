{% extends 'plantilla.html' %}{% block titulo %}Editar personal{% endblock %}{% block contenido %}<div class="mb-4"><span class="eyebrow">Administración · Personal</span><h1 class="page-title">Editar colaborador</h1><p class="page-subtitle">{{ personalEditar.codigo_personal }}</p></div><form action="{% url 'procesarEdicionPersonal' %}" method="post" class="panel">{% csrf_token %}<input type="hidden" name="codigo_personal" value="{{ personalEditar.codigo_personal }}"><div class="panel-body"><div class="row g-3"><div class="col-md-6"><label class="form-label required">Nombres</label><input class="form-control" name="nombres" value="{{ personalEditar.nombres }}" required></div><div class="col-md-6"><label class="form-label required">Apellidos</label><input class="form-control" name="apellidos" value="{{ personalEditar.apellidos }}" required></div><div class="col-md-4"><label class="form-label required">Cédula</label><input class="form-control" name="cedula" value="{{ personalEditar.cedula }}" required></div><div class="col-md-4"><label class="form-label required">Teléfono</label><input class="form-control" name="telefono" value="{{ personalEditar.telefono }}" required></div><div class="col-md-4"><label class="form-label required">Fecha de ingreso</label><input class="form-control" type="date" name="fecha_ingreso" value="{{ personalEditar.fecha_ingreso|date:'Y-m-d' }}" required></div><div class="col-md-6"><label class="form-label required">Área</label><input class="form-control" name="area" value="{{ personalEditar.area }}" required></div><div class="col-md-6"><label class="form-label required">Finca</label><select class="form-select" name="finca" required>{% for f in fincas %}<option value="{{ f.codigo_finca }}" {% if f == personalEditar.finca %}selected{% endif %}>{{ f.nombre }}</option>{% endfor %}</select></div></div></div><div class="panel-head justify-content-end"><a href="{% url 'inicioPersonal' %}" class="btn btn-light">Cancelar</a><button class="btn btn-primary">Guardar cambios</button></div></form>{% endblock %}
