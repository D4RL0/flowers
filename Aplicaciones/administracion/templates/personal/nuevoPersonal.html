{% extends 'plantilla.html' %}{% block titulo %}Nuevo personal{% endblock %}{% block contenido %}<div class="mb-4"><span class="eyebrow">Administración · Personal</span><h1 class="page-title">Registrar colaborador</h1></div><form action="{% url 'guardarPersonal' %}" method="post" class="panel">{% csrf_token %}<div class="panel-body"><div class="row g-3"><div class="col-md-6"><label class="form-label required">Nombres</label><input class="form-control" name="nombres" required></div><div class="col-md-6"><label class="form-label required">Apellidos</label><input class="form-control" name="apellidos" required></div><div class="col-md-4"><label class="form-label required">Cédula</label><input class="form-control" name="cedula" maxlength="10" pattern="[0-9]{10}" required></div><div class="col-md-4"><label class="form-label required">Teléfono</label><input class="form-control" name="telefono" maxlength="15" required></div><div class="col-md-4"><label class="form-label required">Fecha de ingreso</label><input class="form-control" type="date" name="fecha_ingreso" required></div><div class="col-md-6"><label class="form-label required">Área</label><input class="form-control" name="area" placeholder="Ej. Postcosecha" required></div><div class="col-md-6"><label class="form-label required">Finca principal</label><select class="form-select" name="finca" required><option value="">Seleccione...</option>{% for f in fincas %}<option value="{{ f.codigo_finca }}">{{ f.nombre }}</option>{% endfor %}</select></div></div></div><div class="panel-head justify-content-end"><a href="{% url 'inicioPersonal' %}" class="btn btn-light">Cancelar</a><button class="btn btn-primary">Guardar personal</button></div></form>{% endblock %}
