{% extends 'plantilla.html' %}{% block titulo %}Editar finca{% endblock %}{% block contenido %}<div class="mb-4"><span class="eyebrow">Administración · Fincas</span><h1 class="page-title">Editar finca</h1><p class="page-subtitle">{{ fincaEditar.codigo_finca }}</p></div><form action="{% url 'procesarEdicionFinca' %}" method="post" class="panel">{% csrf_token %}<input type="hidden" name="codigo_finca" value="{{ fincaEditar.codigo_finca }}"><div class="panel-body"><div class="row g-3"><div class="col-md-5"><label class="form-label required">Nombre</label><input class="form-control" name="nombre" value="{{ fincaEditar.nombre }}" required></div><div class="col-md-7"><label class="form-label required">Ubicación</label><input class="form-control" name="ubicacion" value="{{ fincaEditar.ubicacion }}" required></div></div></div><div class="panel-head justify-content-end"><a href="{% url 'inicioFinca' %}" class="btn btn-light">Cancelar</a><button class="btn btn-primary">Guardar cambios</button></div></form>{% endblock %}
