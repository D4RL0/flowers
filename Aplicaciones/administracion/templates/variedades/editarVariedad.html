{% extends 'plantilla.html' %}{% block titulo %}Editar variedad{% endblock %}{% block contenido %}<div class="mb-4"><span class="eyebrow">Administración · Variedades</span><h1 class="page-title">Editar variedad</h1><p class="page-subtitle">{{ variedadEditar.codigo_variedad }}</p></div><form action="{% url 'procesarEdicionVariedad' %}" method="post" class="panel">{% csrf_token %}<input type="hidden" name="codigo_variedad" value="{{ variedadEditar.codigo_variedad }}"><div class="panel-body"><label class="form-label required">Nombre</label><input class="form-control" name="nombre" value="{{ variedadEditar.nombre }}" maxlength="100" required></div><div class="panel-head justify-content-end"><a href="{% url 'inicioVariedad' %}" class="btn btn-light">Cancelar</a><button class="btn btn-primary">Guardar cambios</button></div></form>{% endblock %}
