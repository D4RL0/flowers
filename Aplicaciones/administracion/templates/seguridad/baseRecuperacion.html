<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{% block titulo %}Recuperar acceso{% endblock %} | L.Y Flowers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body{min-height:100vh;display:grid;place-items:center;background:#f4f9f5;font-family:Poppins,sans-serif;color:#2e3831}.access-card{width:min(460px,calc(100% - 32px));padding:34px;background:#fff;border:1px solid #dfebe2;border-radius:12px;box-shadow:0 8px 30px rgba(45,92,58,.09)}.access-icon{width:52px;height:52px;display:grid;place-items:center;border-radius:12px;background:#edf8f0;color:#58ad72;font-size:24px}.form-control{padding:.75rem;border-color:#dce6df;border-radius:7px}.form-control:focus{border-color:#8bcca0;box-shadow:0 0 0 .2rem rgba(88,173,114,.14)}.btn{padding:.75rem;border-radius:7px}.btn-success{background:#58ad72;border-color:#58ad72}.btn-success:hover{background:#48975f;border-color:#48975f}.errorlist{margin:7px 0 0;padding:0;list-style:none;color:#b02a37;font-size:.78rem}.helptext{display:block;margin-top:6px;color:#778079;font-size:.72rem}a{color:#438d58}
    </style>
</head>
<body>
<main class="access-card">{% block contenido %}{% endblock %}</main>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
const mensajes=[{% for message in messages %}{texto:'{{ message|escapejs }}',tipo:'{{ message.tags|escapejs }}'}{% if not forloop.last %},{% endif %}{% endfor %}];
(async()=>{for(const mensaje of mensajes){const icono=mensaje.tipo.includes('error')?'error':mensaje.tipo.includes('warning')?'warning':'info';await Swal.fire({icon:icono,title:icono==='error'?'No se pudo completar':icono==='warning'?'Atención':'Información',text:mensaje.texto,confirmButtonColor:'#58ad72'})}})();
</script>
</body>
</html>
