{% extends 'plantilla.html' %}{% block titulo %}Administrar {{ usuarioEditar.username }}{% endblock %}{% block contenido %}<div class="mb-4"><span class="eyebrow">Seguridad</span><h1 class="page-title">Administrar acceso</h1><p class="page-subtitle">{{ usuarioEditar.username }}</p></div><form class="panel" method="post" action="{% url 'procesarUsuario' %}" autocomplete="off">{% csrf_token %}<input type="hidden" name="id" value="{{ usuarioEditar.id }}"><div class="panel-body"><div class="row g-3"><div class="col-md-6"><label class="form-label">Nombres</label><input class="form-control" name="nombre" value="{{ usuarioEditar.first_name }}"></div><div class="col-md-6"><label class="form-label">Apellidos</label><input class="form-control" name="apellido" value="{{ usuarioEditar.last_name }}"></div><div class="col-md-6"><label class="form-label required">Rol</label><select class="form-select" name="rol" required>{% for rol in roles %}<option {% if usuarioEditar.is_superuser and rol == 'Administrador' %}selected{% elif not usuarioEditar.is_superuser and rol in usuarioEditar.groups.all|join:',' %}selected{% endif %}>{{ rol }}</option>{% endfor %}</select></div><div class="col-md-6 d-flex align-items-end"><div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" name="is_active" id="activo" {% if usuarioEditar.is_active %}checked{% endif %}><label class="form-check-label" for="activo">Acceso activo</label></div></div><div class="col-12"><hr><div class="section-title">Cambiar contraseña (opcional)</div></div><div class="col-md-6"><label class="form-label">Nueva contraseña</label><input class="form-control" type="password" name="password" autocomplete="new-password"></div><div class="col-md-6"><label class="form-label">Confirmar contraseña</label><input class="form-control" type="password" name="password_confirmacion" autocomplete="new-password"></div></div></div><div class="panel-head justify-content-end"><a class="btn btn-light" href="{% url 'inicioUsuario' %}">Cancelar</a><button class="btn btn-primary">Guardar seguridad</button></div></form>{% endblock %}
