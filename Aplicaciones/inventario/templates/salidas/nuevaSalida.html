{% extends 'plantilla.html' %}{% block titulo %}Nueva salida{% endblock %}{% block contenido %}<div class="mb-4"><span class="eyebrow">Inventario · Salidas</span><h1 class="page-title">Registrar salida</h1><p class="page-subtitle">No se permitirán cantidades mayores a la existencia disponible.</p></div><form class="panel" method="post" action="{% url 'guardarSalida' %}">{% csrf_token %}<div class="panel-body"><div class="row g-3 mb-4"><div class="col-md-4"><label class="form-label required">Fecha</label><input class="form-control" type="date" name="fecha_salida" required></div><div class="col-md-4"><label class="form-label required">Finca</label><select class="form-select" name="finca" required>{% for f in fincas %}<option value="{{ f.codigo_finca }}">{{ f.nombre }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Destino o bloque</label><input class="form-control" name="destino"></div><div class="col-md-6"><label class="form-label required">Motivo</label><input class="form-control" name="motivo" required></div><div class="col-md-6"><label class="form-label">Observación</label><input class="form-control" name="observacion"></div></div><div class="d-flex justify-content-between mb-3"><div class="section-title">Productos despachados</div><button type="button" class="btn btn-soft" id="agregar"><i class="bi bi-plus-lg"></i> Agregar producto</button></div><div id="detalles"><div class="detail-row detalle mb-2"><div class="row g-2 align-items-end"><div class="col-md-8"><label class="form-label required">Producto</label><select class="form-select" name="producto" required>{% for p in productos %}<option value="{{ p.codigo_producto }}">{{ p.nombre }} · Disponible: {{ p.existencia_actual }} {{ p.unidad_medida.abreviatura }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label required">Cantidad</label><input class="form-control" type="number" min="0.01" step="0.01" name="cantidad_salida" required></div><div class="col-md-1"><button type="button" class="btn btn-outline-danger action-btn quitar"><i class="bi bi-trash"></i></button></div></div></div></div></div><div class="panel-head justify-content-end"><a href="{% url 'inicioSalida' %}" class="btn btn-light">Cancelar</a><button class="btn btn-primary">Registrar salida</button></div></form>{% endblock %}{% block scripts %}<script>const d=document.getElementById('detalles');document.getElementById('agregar').onclick=()=>{let n=d.firstElementChild.cloneNode(true);n.querySelectorAll('input').forEach(x=>x.value='');d.appendChild(n)};d.onclick=e=>{if(e.target.closest('.quitar')&&d.children.length>1)e.target.closest('.detalle').remove()};</script>{% endblock %}
