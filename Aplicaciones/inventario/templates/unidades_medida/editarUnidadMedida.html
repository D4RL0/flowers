{% extends 'plantilla.html' %}{% block titulo %}Editar unidad{% endblock %}{% block contenido %}<div class="mb-4"><span class="eyebrow">Inventario · Unidades</span><h1 class="page-title">Editar unidad</h1></div><form class="panel" method="post" action="{% url 'procesarEdicionUnidadMedida' %}">{% csrf_token %}<input type="hidden" name="codigo_unidad_medida" value="{{ unidadEditar.codigo_unidad_medida }}"><div class="panel-body"><div class="row g-3"><div class="col-md-8"><label class="form-label">Nombre</label><input class="form-control" name="nombre" value="{{ unidadEditar.nombre }}" required></div><div class="col-md-4"><label class="form-label">Abreviatura</label><input class="form-control" name="abreviatura" value="{{ unidadEditar.abreviatura }}" required></div></div></div><div class="panel-head justify-content-end"><a href="{% url 'inicioUnidadMedida' %}" class="btn btn-light">Cancelar</a><button class="btn btn-primary">Guardar cambios</button></div></form>{% endblock %}
