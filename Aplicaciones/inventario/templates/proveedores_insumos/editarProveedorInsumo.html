{% extends 'plantilla.html' %}{% block titulo %}Editar vendedor{% endblock %}{% block contenido %}<div class="mb-4"><span class="eyebrow">Inventario · Vendedores</span><h1 class="page-title">Editar vendedor</h1></div><form class="panel" method="post" action="{% url 'procesarEdicionProveedorInsumo' %}">{% csrf_token %}<input type="hidden" name="codigo_proveedor_insumo" value="{{ proveedorEditar.codigo_proveedor_insumo }}"><div class="panel-body"><div class="row g-3"><div class="col-md-6"><label class="form-label">Empresa</label><input class="form-control" name="nombre_empresa" value="{{ proveedorEditar.nombre_empresa }}" required></div><div class="col-md-6"><label class="form-label">Contacto</label><input class="form-control" name="nombre_contacto" value="{{ proveedorEditar.nombre_contacto }}" required></div><div class="col-md-6"><label class="form-label">Teléfono</label><input class="form-control" name="telefono" value="{{ proveedorEditar.telefono }}" required></div></div></div><div class="panel-head justify-content-end"><a href="{% url 'inicioProveedorInsumo' %}" class="btn btn-light">Cancelar</a><button class="btn btn-primary">Guardar cambios</button></div></form>{% endblock %}
