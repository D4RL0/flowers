{% extends 'plantilla.html' %}{% block titulo %}Editar producto{% endblock %}{% block contenido %}<div class="mb-4"><span class="eyebrow">Inventario · Productos</span><h1 class="page-title">Editar producto</h1></div><form class="panel" method="post" action="{% url 'procesarEdicionProducto' %}">{% csrf_token %}<input type="hidden" name="codigo_producto" value="{{ productoEditar.codigo_producto }}"><div class="panel-body"><div class="row g-3"><div class="col-md-6"><label class="form-label">Nombre</label><input class="form-control" name="nombre" value="{{ productoEditar.nombre }}" required></div><div class="col-md-6"><label class="form-label">Marca</label><input class="form-control" name="marca" value="{{ productoEditar.marca }}"></div><div class="col-md-4"><label class="form-label">Categoría</label><select class="form-select" name="categoria">{% for c in categorias %}<option value="{{ c.codigo_categoria }}" {% if c == productoEditar.categoria %}selected{% endif %}>{{ c.nombre }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Unidad</label><select class="form-select" name="unidad_medida">{% for u in unidades %}<option value="{{ u.codigo_unidad_medida }}" {% if u == productoEditar.unidad_medida %}selected{% endif %}>{{ u.nombre }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Stock mínimo</label><input class="form-control" type="number" step="0.01" min="0" name="stock_minimo" value="{{ productoEditar.stock_minimo|stringformat:'f' }}" required></div></div></div><div class="panel-head justify-content-end"><a href="{% url 'inicioProducto' %}" class="btn btn-light">Cancelar</a><button class="btn btn-primary">Guardar cambios</button></div></form>{% endblock %}
