{% extends 'plantilla.html' %}{% block titulo %}Editar categoría{% endblock %}{% block contenido %}<div class="mb-4"><span class="eyebrow">Inventario · Categorías</span><h1 class="page-title">Editar categoría</h1></div><form class="panel" method="post" action="{% url 'procesarEdicionCategoria' %}">{% csrf_token %}<input type="hidden" name="codigo_categoria" value="{{ categoriaEditar.codigo_categoria }}"><div class="panel-body"><div class="row g-3"><div class="col-md-6"><label class="form-label">Nombre</label><input class="form-control" name="nombre" value="{{ categoriaEditar.nombre }}" required></div><div class="col-md-6"><label class="form-label">Descripción</label><textarea class="form-control" name="descripcion">{{ categoriaEditar.descripcion }}</textarea></div></div></div><div class="panel-head justify-content-end"><a href="{% url 'inicioCategoria' %}" class="btn btn-light">Cancelar</a><button class="btn btn-primary">Guardar cambios</button></div></form>{% endblock %}
